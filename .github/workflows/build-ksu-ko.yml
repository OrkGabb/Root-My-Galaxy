name: Build KernelSU Integrated LKM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential git

      - name: Download Clang 14.0.6 Toolchain
        run: |
          mkdir -p toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz
          tar -xzf clang-r450784d.tar.gz -C toolchain

      - name: Clone Android Common Kernel & KernelSU
        run: |
          git clone --depth=1 -b android13-5.15 https://android.googlesource.com/kernel/common kernel
          git clone --depth=1 https://github.com/tiann/KernelSU

      - name: Patch KernelSU and Configure with Real Config
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          cd kernel
          ../KernelSU/kernel/setup.sh .
          
          # Copia o config exato do M54 para a árvore do kernel
          cp ../kernel_config .config
          
          # Garante o KSU ativo como módulo
          echo "CONFIG_KSU=m" >> .config
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare

      - name: Build KernelSU Module Only
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          cd kernel
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 M=drivers/kernelsu modules

      - name: Upload KernelSU .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-module
          path: kernel/drivers/kernelsu/*.ko
          if-no-files-found: error
