name: Build Kernel Module (.ko)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential

      - name: Download Android Clang Toolchain (r450784d)
        run: |
          mkdir -p toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz
          tar -xzf clang-r450784d.tar.gz -C toolchain

      - name: Clone ACK Headers (android13-5.15)
        run: |
          git clone --depth=1 -b android13-5.15 https://android.googlesource.com/kernel/common kernel

      - name: Prepare Kernel Headers
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          cd kernel
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 defconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare

      - name: Build Module
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          make -C kernel M=$PWD/module ARCH=arm64 LLVM=1 LLVM_IAS=1 modules

      - name: Upload .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-test-module
          path: module/*.ko
