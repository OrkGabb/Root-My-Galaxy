name: Build KernelSU Integrated LKM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential git

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz
          tar -xzf clang-r450784d.tar.gz -C toolchain

      - name: Clone Exynos 1380 Kernel Source & KernelSU
        run: |
          git clone --depth=1 https://github.com/daglaroglou/android_kernel_samsung_a54x kernel
          git clone --depth=1 https://github.com/tiann/KernelSU

      - name: Patch KernelSU and Configure with Real Config
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          cd kernel
          ../KernelSU/kernel/setup.sh .
          
          cp ../kernel_config .config
          
          # Força módulos, KSU e as dependências obrigatórias de KProbes
          echo "CONFIG_MODULES=y" >> .config
          echo "CONFIG_KSU=m" >> .config
          echo "CONFIG_KPROBES=y" >> .config
          echo "CONFIG_HAVE_KPROBES=y" >> .config
          echo "CONFIG_KPROBE_EVENTS=y" >> .config
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          
          echo "=== DIAGNÓSTICO DO CONFIG ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULES" .config
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 prepare

      - name: Build KernelSU Module Only
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          cd kernel
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 M=drivers/kernelsu modules

      - name: Upload KernelSU .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-module
          path: kernel/drivers/kernelsu/*.ko
          if-no-files-found: error
